<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Sistema</title>
    
    <link rel="shortcut icon" href="/auth/ISPK.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
        }
        .progress-container {
            text-align: center;
        }
        .progress-bar {
            transition: width 1s ease;
        }
    </style>
</head>
<body>
<div class="progress-container">
    <h3 id="progressLegend">Iniciando o sistema...</h3>
    <div class="progress" style="height: 30px; width: 80%; margin: 20px auto;">
        <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%;" id="progressBar"></div>
    </div>
</div>

<script>
    let progress = 0;
    const steps = [
        { text: 'Iniciando o sistema...', progress: 20 },
        { text: 'Atualizando os dados...', progress: 40 },
        { text: 'Buscando informações...', progress: 60 },
        { text: 'Finalizando a atualização...', progress: 80 },
        { text: 'Aguarde, caro usuário...', progress: 100 }
    ];

    const progressBar = document.getElementById('progressBar');
    const progressLegend = document.getElementById('progressLegend');

    function updateProgress(index) {
        if (index < steps.length) {
            progressBar.style.width = steps[index].progress + '%';
            progressLegend.innerText = steps[index].text;
            setTimeout(() => updateProgress(index + 1), 1000);
        } else {
            // Redirecionar para a página de login na pasta auth
            setTimeout(() => {
                window.location.href = './auth/login.php'; // Redireciona para a página de login
            }, 1000);
        }
    }

    updateProgress(0);
</script>

</body>
</html>
